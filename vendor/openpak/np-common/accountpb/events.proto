syntax = "proto3";

package openpak.account.v1;

option go_package = "openpak/account/proto/openpak/account/v1;accountv1";

// Durable invalidation events (PRD §7): consumers poll and process with
// deduplication. Versions are monotonic per event stream.
//
// SubscribeAccountEvents (universal-social-prd §4a) is the push form of the
// same stream: version is deliberately the number the poll cursor uses, so an
// adapter can switch between the two without losing its place, and the poll
// stays for adapters that were offline. Delivery is at-least-once either way;
// deduplication by event_id is the receiver's job.
service Events {
  rpc PollEvents(PollEventsRequest) returns (PollEventsResponse);
  rpc SubscribeAccountEvents(SubscribeAccountEventsRequest) returns (stream InvalidationEvent);
  // For internal services whose own state change must reach an account
  // through the universal stream (chat: Kind = message). The type must be
  // one of the closed set; the caller owns the fact it announces.
  rpc EmitEvent(EmitEventRequest) returns (EmitEventResponse);
}

message SubscribeAccountEventsRequest {
  uint64 since_version = 1; // stream every event with version > this, then stay live
}

message EmitEventRequest {
  string type = 1;
  string account_id = 2; // who must hear it
  string namespace = 3;
  string subject_id = 4;
}

message EmitEventResponse {
  InvalidationEvent event = 1;
}

message PollEventsRequest {
  uint64 since_version = 1; // return events with version > this
  int32  limit = 2;         // max events per page (server-capped at 1000)
}

message PollEventsResponse {
  repeated InvalidationEvent events = 1;
  uint64 max_version = 2;   // highest version in stream; use as next since_version
}

message InvalidationEvent {
  uint64 version = 1;
  string event_id = 2;      // stable ID for dedup
  string type = 3;          // account_banned | account_unbanned | link_unlinked | account_delete_started | account_deleted | credential_revoked | friend_requested | friend_accepted | friend_removed | invitation_sent | message | email_changed (account = who must hear it, subject = the other party or, for message, the chat message id; email_changed has no subject: re-read the account)
  string account_id = 4;
  string namespace = 5;     // set when scoped to one adapter link
  string subject_id = 6;    // set when scoped to one adapter link
  int64  created_at_unix = 7;
}
